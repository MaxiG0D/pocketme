name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build and test (Scripts/ci.sh)
        run: Scripts/ci.sh --ui
      - name: Build release applet (existing Carnet template)
        run: Release/build_release_app.sh
