name: PocketMe
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  PocketMe:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Config/App-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/App-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExtension-iOS
        embed: true
        destinationFilters: [iOS]
      - target: ShareExtension-macOS
        embed: true
        destinationFilters: [macOS]
  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension-iOS
      - {path: Shared/Design}
      - {path: Shared/Resources}
      - {path: Shared/Services/SaveQueue.swift}
      - {path: Shared/Model/AppIdentity.swift}
      - {path: Shared/Util/URLNormalizer.swift}
      - {path: Shared/Share}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share.ios
        INFOPLIST_FILE: Config/Share-iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  ShareExtension-macOS:
    type: app-extension
    platform: macOS
    sources:
      - ShareExtension-macOS
      - {path: Shared/Design}
      - {path: Shared/Resources}
      - {path: Shared/Services/SaveQueue.swift}
      - {path: Shared/Model/AppIdentity.swift}
      - {path: Shared/Util/URLNormalizer.swift}
      - {path: Shared/Share}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share.macos
        INFOPLIST_FILE: Config/Share-macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share-macOS.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  PocketMeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PocketMeTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PocketMe.app/Contents/MacOS/PocketMe
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PocketMe
schemes:
  PocketMe:
    build:
      targets:
        PocketMe: all
    test:
      targets: [PocketMeTests]
